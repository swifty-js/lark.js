name: Deploy https://tianchenghang.github.io/lark.js

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: "${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'ci: Deploy gomoku') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Setup pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build lark-mvc
        run: pnpm build:mvc
      - name: Build gomoku
        run: pnpm build:gomoku
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./packages/gomoku/dist

  deploy:
    if: "${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'ci: Deploy gomoku') }}"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
