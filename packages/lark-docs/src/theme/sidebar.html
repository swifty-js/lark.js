<nav class="flex flex-col" aria-label="Documentation">
  {{forOf sidebarGroups as group}}
  <div class="mb-6">
    <button
      data-key="{{=group.key}}"
      @click="toggleGroup()"
      aria-expanded="{{if group.collapsed}}false{{else}}true{{/if}}"
      class="group text-muted-foreground hover:text-foreground flex w-full items-center justify-between rounded-md px-2 py-1.5 font-mono text-[11px] font-semibold tracking-[0.14em] uppercase transition-colors duration-200"
    >
      {{=group.text}}
      <span
        class="size-3.5 opacity-60 transition-transform duration-300 ease-[cubic-bezier(0.32,0.72,0,1)] [&>svg]:size-full {{if group.collapsed}}-rotate-90{{/if}}"
      >
        {{!icons.chevronDown}}
      </span>
    </button>
    <div
      class="grid transition-[grid-template-rows,opacity] duration-300 ease-[cubic-bezier(0.32,0.72,0,1)] {{if group.collapsed}}grid-rows-[0fr] opacity-0{{else}}grid-rows-[1fr] opacity-100{{/if}}"
    >
      <div class="overflow-hidden">
        <ul class="border-border/70 mt-1.5 ml-2 border-l pl-px">
          {{forOf group.rows as row}}
          <li>
            {{if row.isGroup}}
            <button
              data-key="{{=row.key}}"
              @click="toggleNested()"
              aria-expanded="{{if row.groupOpen}}true{{else}}false{{/if}}"
              class="flex w-full items-center gap-1.5 rounded-md py-1.5 pr-2 text-[13px] font-medium transition-colors duration-200 {{if row.containsActive}}text-foreground{{else}}text-muted-foreground hover:text-foreground{{/if}}"
              style="padding-left: {{=row.padPx}}px"
            >
              <span
                class="size-3.5 shrink-0 opacity-60 transition-transform duration-300 ease-[cubic-bezier(0.32,0.72,0,1)] [&>svg]:size-full {{if row.groupOpen}}rotate-90{{/if}}"
              >
                {{!icons.chevronRight}}
              </span>
              {{=row.text}}
            </button>
            {{else}}
            <a
              data-href="{{=row.link}}"
              @click="navigateTo()"
              aria-current="{{if row.isActive}}page{{/if}}"
              class="relative -ml-px block border-l-2 py-1.5 pr-2 text-[13px] leading-snug transition-[color,background-color,border-color] duration-200 {{if row.isActive}}border-primary bg-primary/8 text-primary font-medium{{else}}hover:border-border hover:bg-accent/50 hover:text-foreground border-transparent text-muted-foreground{{/if}}"
              style="padding-left: {{=row.padPx}}px"
            >
              {{=row.text}}
            </a>
            {{/if}}
          </li>
          {{/forOf}}
        </ul>
      </div>
    </div>
  </div>
  {{/forOf}}
</nav>
