{{if disabled}}
<wa-button
  class="{{=styles['button']}}"
  type="button"
  variant="{{=waVariant}}"
  appearance="{{=waAppearance}}"
  size="{{=waSize}}"
  disabled
  @click="press()"
>
  {{=label}}
</wa-button>
{{else}}
<wa-button
  class="{{=styles['button']}}"
  type="button"
  variant="{{=waVariant}}"
  appearance="{{=waAppearance}}"
  size="{{=waSize}}"
  @click="press()"
>
  {{=label}}
</wa-button>
{{/if}}
