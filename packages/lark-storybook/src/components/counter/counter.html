<div class="{{=styles['counter']}}">
  <div class="{{=styles['counter__label']}}">{{=label}}</div>

  <div class="{{=styles['counter__value']}}">{{=count}}</div>

  <wa-button-group
    class="{{=styles['counter__actions']}}"
    label="Counter actions"
  >
    <wa-button
      type="button"
      variant="neutral"
      appearance="outlined"
      size="s"
      @click="decrement()"
    >
      - {{=step}}
    </wa-button>
    <wa-button
      type="button"
      variant="neutral"
      appearance="plain"
      size="s"
      @click="reset()"
    >
      Reset
    </wa-button>
    <wa-button
      type="button"
      variant="brand"
      appearance="filled"
      size="s"
      @click="increment()"
    >
      + {{=step}}
    </wa-button>
  </wa-button-group>
</div>
